<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G4 MASH // STORY S1</title>
  <style>
    :root {
      --bg: #05080c;
      --panel-bg: #090e15;
      --border: #1a2736;
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.4);
      --dim: #5c728a;
      --text: #c8d8e8;
      --amber: #ffaa00;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: monospace, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(#101722 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
    }

    /* Sticky HUD Top Bar */
    .reader-hud {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(5, 8, 12, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1.5px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .back-btn {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 1.5px;
    }

    .back-btn:hover {
      text-shadow: 0 0 8px var(--cyan);
    }

    .chapter-title-hud {
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 1px;
    }

    select.chapter-select {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--cyan);
      padding: 5px 10px;
      font-size: 10px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    /* Text Reader Stage */
    .reader-stage {
      width: 100%;
      max-width: 820px;
      margin-top: 28px;
      padding: 0 16px;
    }

    /* Cyber Terminal Log Card */
    .log-card {
      background: var(--panel-bg);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      position: relative;
      min-height: 400px;
    }

    .log-card::before {
      content: '// DATA STREAM // ENCRYPTED TXT FEED';
      position: absolute;
      top: -9px;
      left: 20px;
      background: var(--bg);
      padding: 0 8px;
      font-size: 9px;
      color: var(--cyan);
      letter-spacing: 1.5px;
      font-weight: bold;
    }

    /* Clean Reading Typography */
    .story-paragraph {
      font-family: 'Georgia', 'Cambria', serif; /* Reading comfortable font */
      font-size: 16px;
      line-height: 1.9;
      color: #d2dfed;
      margin-bottom: 22px;
      letter-spacing: 0.3px;
      text-align: justify;
    }

    .story-paragraph:last-child {
      margin-bottom: 0;
    }

    /* Loading and Error Feedback States */
    .status-msg {
      font-family: monospace;
      color: var(--dim);
      font-size: 12px;
      text-align: center;
      padding: 40px 0;
      letter-spacing: 1px;
    }

    .status-msg.error {
      color: var(--amber);
    }

    /* Bottom Nav */
    .nav-footer {
      width: 100%;
      max-width: 820px;
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
      padding: 0 16px;
    }

    .nav-btn {
      background: rgba(0, 240, 255, 0.08);
      border: 1.5px solid var(--cyan);
      color: var(--cyan);
      padding: 8px 18px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .nav-btn:disabled {
      border-color: var(--border);
      color: var(--dim);
      background: transparent;
      cursor: not-allowed;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- TOP HUD -->
  <header class="reader-hud">
    <a href="story1.html" class="back-btn">&lt;&lt; STORY HUB</a>
    <span class="chapter-title-hud" id="hudTitle">INITIALIZING...</span>
    <select class="chapter-select" id="chapterDropdown"></select>
  </header>

  <!-- MAIN READING STAGE -->
  <main class="reader-stage">
    <article class="log-card">
      <div id="storyContainer">
        <div class="status-msg">FETCHING STORY DATA...........</div>
      </div>
    </article>
  </main>

  <!-- BOTTOM CHAPTER STEPPER -->
  <footer class="nav-footer">
    <button class="nav-btn" id="prevBtn">&lt; PREV CH.</button>
    <button class="nav-btn" id="nextBtn">NEXT CH. &gt;</button>
  </footer>

  <script>
    /* =========================================================
       CHAPTER TXT REGISTRY
       Jab bhi naya chapter likho, bas ek line list me add karni hai:
       ========================================================= */
    const CHAPTERS = [
    { id: 1, title: " HE CH 01: TH ONE WHO DOSENT SEE", file: "BLINDSPOTHECH1.txt" },
      { id: 2, title: "HE CH 02: COMING SOON",  file: "BLINDSPOTHECH2.txt" },
      { id: 3, title: "HE CH 03: COMING SOON",   file: "BLINDSPOTHECH3.txt" }
      // Future: { id: 4, title: "CH 04: SILENT RUNNER", file: "BLINDSPOTHEch4.txt" }
    ];

    let currentIdx = 0;

    const hudTitle = document.getElementById('hudTitle');
    const chapterDropdown = document.getElementById('chapterDropdown');
    const storyContainer = document.getElementById('storyContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Populate Dropdown
    CHAPTERS.forEach((ch, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = ch.title;
      chapterDropdown.appendChild(opt);
    });

    // Fetch and Load .txt file
    async function loadChapter(index) {
      currentIdx = index;
      const chapter = CHAPTERS[index];

      // Update UI Header & Select
      hudTitle.textContent = chapter.title;
      chapterDropdown.value = index;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Prev / Next button state
      prevBtn.disabled = (index === 0);
      nextBtn.disabled = (index === CHAPTERS.length - 1);

      // Loading state
      storyContainer.innerHTML = `<div class="status-msg">[ FETCHING: ${chapter.file} ... ]</div>`;

      try {
        const response = await fetch(chapter.file);

        if (!response.ok) {
          throw new Error(`FILE NOT FOUND (${response.status})`);
        }

        const rawText = await response.text();

        // Double line breaks ko clean paragraphs me convert karna
        const paragraphs = rawText
          .split(/\r?\n\r?\n/) // Splits by blank lines
          .map(p => p.trim())
          .filter(p => p.length > 0);

        if (paragraphs.length === 0) {
          storyContainer.innerHTML = `<div class="status-msg">// FILE IS EMPTY //</div>`;
          return;
        }

        // Display paragraphs
        storyContainer.innerHTML = paragraphs
          .map(p => `<p class="story-paragraph">${p}</p>`)
          .join('');

      } catch (err) {
        storyContainer.innerHTML = `
          <div class="status-msg error">
            [ FAILED TO DECRYPT DATA STREAM ]<br>
            Make sure '${chapter.file}' exists in your GitHub repository.
          </div>
        `;
      }
    }

    // Event Listeners
    chapterDropdown.addEventListener('change', (e) => loadChapter(parseInt(e.target.value, 10)));
    prevBtn.addEventListener('click', () => { if (currentIdx > 0) loadChapter(currentIdx - 1); });
    nextBtn.addEventListener('click', () => { if (currentIdx < CHAPTERS.length - 1) loadChapter(currentIdx + 1); });

    // Initial Load
    loadChapter(0);
  </script>
</body>
</html>
