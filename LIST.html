<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>G4 MASH // MATRIX VAULT</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #080b0f;
      background-image: radial-gradient(#141c26 1px, transparent 1px);
      background-size: 32px 32px;
      color: #00f0ff;
      font-family: monospace, Courier, sans-serif;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: 14px 20px;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-top: none;
      padding: 10px 18px;
      font-size: 11px;
      letter-spacing: 2px;
      position: relative;
      z-index: 10;
    }

    .hud-header::before, .hud-header::after {
      content: '';
      position: absolute;
      top: 0;
      width: 12px;
      height: 2px;
      background: #00f0ff;
    }
    .hud-header::before { left: 0; }
    .hud-header::after { right: 0; }

    .back-link {
      color: #00f0ff;
      text-decoration: none;
      font-weight: bold;
    }

    /* Pura screen viewport taaki jab panels khulein to cut na hon */
    .viewport-center {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .box-frame {
      width: 100vw;
      height: 85vh;
      border: none;
      overflow: visible;
    }

    .hud-footer {
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-bottom: none;
      padding: 8px 18px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(0, 240, 255, 0.7);
      position: relative;
      z-index: 10;
    }

    .hud-footer::before, .hud-footer::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 12px;
      height: 2px;
      background: #00f0ff;
    }
    .hud-footer::before { left: 0; }
    .hud-footer::after { right: 0; }
  </style>
</head>
<body>

  <header class="hud-header">
    <a href="index.html" class="back-link">&lt;&lt; [ CLOSE BOX ]</a>
    <span>[ INTERNAL DATA RACKS // DECRYPTED ]</span>
  </header>

  <main class="viewport-center">
    <iframe src="LISTbox.html" class="box-frame" loading="eager"></iframe>
  </main>

  <footer class="hud-footer">
    © 2022 G4 MASH // ARCHIVE CHAMBER // UNFOLD PROTOCOL
  </footer>

</body>
</html>
